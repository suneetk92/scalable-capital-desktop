# Reusable: builds the desktop installers for every target. Called by ci.yml and release.yml.
name: Build

on:
  workflow_call:
    inputs:
      sign:
        description: Sign the updater payloads with the Tauri updater key (tagged releases only).
        type: boolean
        default: false
      version:
        description: A tag like v1.2.3 to write into package.json, Cargo.toml and tauri.conf.json before building. Empty keeps the committed version.
        type: string
        default: ""
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: windows-x64
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: macos-arm64
            updater-arch: aarch64
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: macos-x64
            updater-arch: x64
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            artifact: linux-x64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            artifact: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libssl-dev pkg-config clang lld \
            libfuse2 xdg-utils file patchelf rpm

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Set the version from the tag
        if: inputs.version != ''
        shell: bash
        run: node scripts/set-version.mjs "${{ inputs.version }}"

      # Optional Windows code signing: only when the certificate secrets exist (a base64 .pfx).
      # It adds a config overlay with the thumbprint of the imported certificate.
      - name: Import the Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host 'No Windows signing certificate configured; the installers stay unsigned.'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $overlay = Join-Path $env:RUNNER_TEMP 'tauri.windows-sign.conf.json'
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 5 | Set-Content $overlay
          "WINDOWS_SIGN_CONFIG=$overlay" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Secrets that are not set arrive as empty strings, and Tauri treats an empty variable as
      # present, so they are unset before the build. macOS signing and notarization switch on by
      # themselves when the APPLE_* variables are set.
      - name: Build installers
        shell: bash
        env:
          SIGN: ${{ inputs.sign }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.sign && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          configs=()
          if [ "$SIGN" = "true" ]; then configs+=(--config src-tauri/tauri.updater.conf.json); fi
          if [ -n "${WINDOWS_SIGN_CONFIG:-}" ]; then configs+=(--config "$WINDOWS_SIGN_CONFIG"); fi
          # The Windows MSI cannot carry a pre-release version such as 1.2.3-rc.1, so those build NSIS only.
          bundles="${{ matrix.bundles }}"
          case "${{ inputs.version }}" in *-*) bundles="${bundles/,msi/}" ;; esac
          npx tauri build --target ${{ matrix.target }} --bundles "$bundles" "${configs[@]}"

      # Both macOS builds produce scalable-capital-desktop.app.tar.gz; the architecture keeps them apart.
      - name: Name the macOS updater payload by architecture
        if: runner.os == 'macOS' && inputs.sign
        shell: bash
        run: |
          dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          mv "$dir/scalable-capital-desktop.app.tar.gz" "$dir/scalable-capital-desktop_${{ matrix.updater-arch }}.app.tar.gz"
          mv "$dir/scalable-capital-desktop.app.tar.gz.sig" "$dir/scalable-capital-desktop_${{ matrix.updater-arch }}.app.tar.gz.sig"

      - name: Collect the portable Windows exe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist-artifacts
          cp "src-tauri/target/${{ matrix.target }}/release/scalable-capital-desktop.exe" dist-artifacts/scalable-capital-desktop-portable-windows-x64.exe

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: scalable-capital-desktop-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-artifacts/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig
