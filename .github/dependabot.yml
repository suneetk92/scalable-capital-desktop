version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 has no JavaScript API, which scripts/check-exports.mjs needs
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  # The actions are pinned to commit SHAs with the tag in a comment; Dependabot updates both.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Pinned to the commit of its 1.99.1 branch, and the toolchain input names the Rust version; it must
      # match src-tauri/rust-toolchain.toml and rust-version in Cargo.toml, so it is updated by hand
      - dependency-name: dtolnay/rust-toolchain
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch