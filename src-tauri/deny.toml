# cargo-deny configuration (run in CI's "Dependency audits" job; locally with `cargo deny check`).
# It supplements `cargo audit`: licences, duplicate crate versions and the registry sources are
# checked too. The app is Apache-2.0: keep the licence list to permissive licences and the weak,
# file-level copyleft of MPL-2.0, which only covers changes to the MPL files themselves.

[graph]
# Every target that .github/workflows/build.yml ships.
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
all-features = false

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Unmaintained crates are reported for direct dependencies only: the transitive ones come from Tauri
# (Linux and build-time crates) and have no replacement this project can choose.
unmaintained = "workspace"
ignore = [
  # zip 4 comes from tauri-plugin-updater, whose latest release has no fix yet. All three are about
  # extracting Unix permission bits and symlinks. The updater only extracts an update that is a zip
  # archive (this app ships the NSIS installer itself) and checks its signature first. Keep this list
  # in step with the `cargo audit --ignore` flags in .github/workflows/ci.yml.
  { id = "RUSTSEC-2026-0367", reason = "zip via tauri-plugin-updater; Unix-only extraction issue, no fixed release" },
  { id = "RUSTSEC-2026-0368", reason = "zip via tauri-plugin-updater; Unix-only extraction issue, no fixed release" },
  { id = "RUSTSEC-2026-0369", reason = "zip via tauri-plugin-updater; Unix-only extraction issue, no fixed release" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "MPL-2.0",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
