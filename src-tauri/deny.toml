# cargo-deny configuration (run in CI's "Dependency audits" job; locally with `cargo deny check`).
# It supplements `cargo audit`: licences, duplicate crate versions and the registry sources are
# checked too. Keep the licence list to permissive licences; copyleft is not compatible with a
# closed-source Windows installer.

[graph]
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]
all-features = false

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "MPL-2.0",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# Crates whose licence is only in their LICENSE file, not in `Cargo.toml`.
[[licenses.clarify]]
crate = "dlopen2"
expression = "MIT"

[[licenses.clarify]]
crate = "dlopen2_derive"
expression = "MIT"

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
